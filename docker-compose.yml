# Local PostgreSQL for trying the production database setup. Development only.
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/pet_adopt
# Set POSTGRES_PASSWORD (and use it in DATABASE_URL) on any machine other people can reach.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pet_adopt
    ports:
      # Loopback only, so the database is not exposed to the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - pet_adopt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pet_adopt']
      interval: 5s
      retries: 10

volumes:
  pet_adopt_pgdata:
